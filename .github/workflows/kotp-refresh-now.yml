name: KOTP — actualisation ponctuelle FFB (2026-11-10)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kotp-refresh-now.yml'

permissions:
  contents: write

concurrency:
  group: kotp-update-pp
  cancel-in-progress: false

jobs:
  refresh-now:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer KOTP
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Contrôler les secrets FFB
        env:
          FFB_EMAIL: ${{ secrets.FFB_EMAIL }}
          FFB_PASSWORD: ${{ secrets.FFB_PASSWORD }}
          FFB_FIREBASE_API_KEY: ${{ secrets.FFB_FIREBASE_API_KEY }}
        run: |
          if [ -z "$FFB_EMAIL" ] || [ -z "$FFB_PASSWORD" ] || [ -z "$FFB_FIREBASE_API_KEY" ]; then
            echo 'Secrets FFB manquants.' >&2
            exit 1
          fi
      - name: Tests de sécurité du calcul
        run: node --test tests/update-pp.test.mjs
      - name: Contrôler le format de la réponse FFB pour le joueur bloquant
        env:
          FFB_EMAIL: ${{ secrets.FFB_EMAIL }}
          FFB_PASSWORD: ${{ secrets.FFB_PASSWORD }}
          FFB_FIREBASE_API_KEY: ${{ secrets.FFB_FIREBASE_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { makeFfbClient } from './scripts/update-pp.mjs';
          try {
            const api = await makeFfbClient({ email: process.env.FFB_EMAIL, password: process.env.FFB_PASSWORD });
            const season = await api.currentSeason();
            const rank = await api.ranking(168531, season.id);
            const iv = rank?.iv;
            console.log('FFB structure (sans identifiants privés): ' + JSON.stringify({
              seasonId:season.id,
              rootKeys: rank && typeof rank === 'object' ? Object.keys(rank).slice(0,30) : [],
              ivKeys: iv && typeof iv === 'object' ? Object.keys(iv).slice(0,40) : [],
              ppSeasonType: typeof iv?.ppSeason,
              ppSeasonValue: iv?.ppSeason ?? null,
              ppTotal: iv?.ppTotal ?? null,
              pp: iv?.pp ?? null,
              ppWithdrawal: iv?.ppWithdrawal ?? null
            }));
          } catch(e) {
            console.log('Diagnostic FFB sans valeur : '+String(e?.message||e).slice(0,130));
          }
          JS
      - name: Actualiser les PP via la FFB
        env:
          FFB_EMAIL: ${{ secrets.FFB_EMAIL }}
          FFB_PASSWORD: ${{ secrets.FFB_PASSWORD }}
          FFB_FIREBASE_API_KEY: ${{ secrets.FFB_FIREBASE_API_KEY }}
        run: node scripts/update-pp.mjs index.html
      - name: Publier uniquement si le contrôle est complet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'KOTP: actualisation immédiate des PP (2026-11-10)'
            git push
          else
            echo 'Aucune modification à publier.'
          fi

name: Update official KOTP PWA icon

on:
  push:
    paths:
      - 'icons/kotp-official.webp.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-pwa-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --quiet Pillow
      - name: Generate PNG icons and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, re
          from PIL import Image

          original = base64.b64decode(Path("icons/kotp-official.webp.b64").read_text().strip())
          with Image.open(io.BytesIO(original)) as img:
              base = img.convert("RGB")
              for size in (180, 192, 512):
                  base.resize((size, size), Image.Resampling.LANCZOS).save(
                      f"icons/icon-{size}.png", format="PNG", optimize=True
                  )
          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r"const CACHE_VERSION = 'kotp-shell-v\d+';",
                      "const CACHE_VERSION = 'kotp-shell-v2';", sw, count=1)
          sw_path.write_text(sw, encoding="utf-8")
          PY
      - name: Commit and publish updated PWA icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-180.png icons/icon-192.png icons/icon-512.png sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'KOTP: install official Provence icon for PWA'
            git push origin HEAD:main
          fi
